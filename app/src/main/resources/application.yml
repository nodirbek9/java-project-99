spring:
  application:
    name: app
  datasource:
    url: jdbc:h2:mem:blog
    driverClassName: org.h2.Driver
    username: admin
    password: 1234
  h2.console:
    enabled: true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  hibernate:
    ddl-auto: update
server:
  port: 8080