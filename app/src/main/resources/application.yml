spring:
  application:
    name: app
  datasource:
    url: jdbc:h2:mem:app;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: ''
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: ${JWT_SECRET:change-me-please-this-secret-must-be-at-least-32-bytes-long}

server:
  port: ${PORT:8080}
